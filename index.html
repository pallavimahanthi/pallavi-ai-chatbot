<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pallavi AI — Your smart AI assistant. Ask me anything." />
  <title>Pallavi AI — Smart AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ================= SIDEBAR ================= -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">P</span>
        <span class="logo-text">Pallavi AI</span>
      </div>
      <button id="sidebarClose" class="icon-btn sidebar-close" title="Close sidebar" aria-label="Close sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <button id="btnNewChat" class="new-chat-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>New Chat</span>
    </button>

    <div class="sidebar-history-label">Chat History</div>
    <div id="chatHistory" class="chat-history">
      <!-- History items injected by JS -->
    </div>

    <div class="sidebar-footer">
      <button id="btnThemeToggle" class="sidebar-footer-btn" title="Toggle theme">
        <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <span id="themeLabel">Light Mode</span>
      </button>
      <div class="demo-badge">Demo Mode</div>
    </div>
  </aside>

  <!-- Sidebar overlay for mobile -->
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <!-- ================= MAIN AREA ================= -->
  <main class="main-area">
    <!-- Top bar -->
    <header class="topbar">
      <button id="sidebarOpen" class="icon-btn" title="Open sidebar" aria-label="Open sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title">
        <span class="topbar-logo">P</span>
        <span>Pallavi AI</span>
      </div>
      <button id="btnClearChat" class="icon-btn topbar-clear" title="Clear chat" aria-label="Clear chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </header>

    <!-- Welcome screen -->
    <div id="welcomeScreen" class="welcome-screen">
      <div class="welcome-content">
        <div class="welcome-avatar">
          <span>P</span>
        </div>
        <h1>Hello! I'm Pallavi AI</h1>
        <p class="welcome-subtitle">Your smart AI assistant. Ask me anything.</p>

        <div class="example-cards">
          <button class="example-card" data-prompt="Explain Python programming language in simple terms">
            <div class="example-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            </div>
            <div class="example-text">
              <strong>Explain Python</strong>
              <span>Learn the basics of Python</span>
            </div>
          </button>

          <button class="example-card" data-prompt="Help me prepare for my upcoming job interview with common questions and tips">
            <div class="example-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9M14 17H5M17 17a3 3 0 1 0 6 0 3 3 0 0 0-6 0zM3 7a3 3 0 1 0 6 0 3 3 0 0 0-6 0z"/></svg>
            </div>
            <div class="example-text">
              <strong>Help me prepare for interviews</strong>
              <span>Common questions and tips</span>
            </div>
          </button>

          <button class="example-card" data-prompt="Generate a unique project idea for my college assignment">
            <div class="example-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17h8v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z"/></svg>
            </div>
            <div class="example-text">
              <strong>Generate a project idea</strong>
              <span>Creative ideas for college</span>
            </div>
          </button>

          <button class="example-card" data-prompt="Write a short poem about technology and nature">
            <div class="example-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
            </div>
            <div class="example-text">
              <strong>Write a poem</strong>
              <span>About technology and nature</span>
            </div>
          </button>
        </div>

        <p class="demo-notice">Pallavi AI runs in demo mode — responses are simulated for demonstration purposes.</p>
      </div>
    </div>

    <!-- Chat messages -->
    <div id="chatContainer" class="chat-container">
      <!-- Messages injected by JS -->
    </div>

    <!-- Input area -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="messageInput" class="message-input" rows="1" placeholder="Send a message to Pallavi AI..." ></textarea>
        <button id="btnSend" class="send-btn" title="Send message" aria-label="Send message" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <p class="input-hint">Press Enter to send · Shift + Enter for new line</p>
    </div>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
